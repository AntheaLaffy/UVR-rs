name: Build CLI and GUI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target/ci
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols
  # Build a portable ISA baseline, independent of the hosted runner's CPU.
  RUSTFLAGS: -C target-cpu=x86-64

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            features: uvr-cli/openvino,uvr-gui/openvino,uvr-gui/custom-protocol
          - os: windows-2022
            platform: windows-x86_64
            features: uvr-gui/custom-protocol
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf python3-pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.1.0
          cache: true
          run_install: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check synchronized application versions
        run: python3 tools/scan-workspace.py --check-version

      - name: Install locked web dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Build web frontend
        run: pnpm build

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --locked --features '${{ matrix.features }}' -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked --features '${{ matrix.features }}'

      - name: Build release CLI and GUI
        run: cargo build --release --locked -p uvr-cli -p uvr-gui --features '${{ matrix.features }}'

      - name: Smoke test the CLI
        run: |
          ./target/ci/release/uvr --help
          ./target/ci/release/uvr --version

      - name: Acquire optional OpenVINO CPU libraries
        if: runner.os == 'Linux'
        # The wheel is a build-time source of native libraries; Python stays out of artifacts.
        run: |
          python3 -m pip install --no-deps --only-binary=:all: --target target/ci-openvino openvino==2026.3.1

      - name: Package Linux binaries and optional runtime
        if: runner.os == 'Linux'
        run: node tools/package-ci.mjs linux-x86_64 target/ci/release target/ci-openvino

      - name: Package Windows binaries
        if: runner.os == 'Windows'
        run: node tools/package-ci.mjs windows-x86_64 target/ci/release

      - name: Upload lightweight CLI and GUI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uvr-${{ matrix.platform }}
          path: target/ci-artifacts/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload optional OpenVINO CPU runtime
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uvr-openvino-cpu-2026.3.1-linux-x86_64
          path: target/ci-artifacts/openvino-cpu-linux-x86_64/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
