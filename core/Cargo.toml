[package]
name = "uvr-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
burn-cpu = ["dep:anyhow", "dep:burn-flex", "dep:burn-tensor", "dep:burn-store", "dep:rayon"]
audio-io = ["dep:anyhow", "dep:symphonia", "dep:hound", "dep:tempfile"]
model-download = ["dep:anyhow", "dep:reqwest", "dep:tokio", "dep:tempfile"]
openvino = ["burn-cpu", "dep:openvino"]

[dependencies]
md-5 = "0.10.6"
sha2 = "0.10.9"
rustfft = "6.4.1"
anyhow = { version = "1.0", optional = true }
burn-flex = { version = "=0.21.0", optional = true }
burn-tensor = { version = "=0.21.0", optional = true }
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "pytorch"], optional = true }
rayon = { version = "1.11", optional = true }
openvino = { version = "=0.11.0", features = ["runtime-linking"], optional = true }
symphonia = { version = "=0.5.5", default-features = false, features = ["wav", "pcm", "mp3", "flac"], optional = true }
hound = { version = "=3.5.1", optional = true }
tempfile = { version = "=3.27.0", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "socks", "system-proxy"], optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
