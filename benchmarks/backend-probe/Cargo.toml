[package]
name = "uvr-backend-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Candidate frameworks stay outside the product workspace until experiments justify a choice.
[workspace]

[features]
openvino = ["dep:openvino", "uvr-core/openvino"]

[[bin]]
name = "probe-openvino-audio"
required-features = ["openvino"]
test = false

[[bin]]
name = "export-roformer-openvino"
required-features = ["openvino"]
test = false

[[bin]]
name = "probe-openvino-core-audio"
required-features = ["openvino"]
test = false

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
rustfft = "=6.4.1"
rayon = "1.11"
candle-core = { version = "=0.10.2", default-features = false }
burn-flex = "=0.21.0"
burn-tensor = "=0.21.0"
uvr-core = { path = "../../core", features = ["burn-cpu"] }
openvino = { version = "=0.11.0", features = ["runtime-linking"], optional = true }

[lints.rust]
unsafe_code = "forbid"
