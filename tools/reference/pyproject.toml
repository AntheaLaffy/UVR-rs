[project]
name = "uvr-reference"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beartype==0.22.9",
    "einops==0.8.2",
    "librosa==0.9.2",
    "numpy==2.2.6",
    "packaging==26.3",
    "pyyaml==6.0.3",
    "rotary-embedding-torch==0.9.1",
    "scipy==1.16.3",
    "setuptools==80.9.0",
    "torch==2.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
